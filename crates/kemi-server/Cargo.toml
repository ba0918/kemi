[package]
name = "kemi-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP and SSE server for kemi"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
kemi-core = { path = "../kemi-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "io-util"] }
