<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kemi</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div id="topbar">
      <h1 id="review-title">kemi</h1>
      <span id="review-stats"></span>
      <span class="spacer"></span>
      <button id="mode-unified" type="button">unified</button>
      <button id="mode-split" type="button">split</button>
      <button id="toggle-wrap" type="button">折返し</button>
      <button id="toggle-focus" type="button">重点のみ</button>
      <button id="toggle-sort" type="button">変更量順</button>
      <select id="theme-select" aria-label="テーマ">
        <option value="auto">自動</option>
        <option value="light">light</option>
        <option value="dark">dark</option>
        <option value="solarized-light">solarized light</option>
        <option value="solarized-dark">solarized dark</option>
      </select>
    </div>
    <div id="layout">
      <aside id="tree" aria-label="ファイルツリー"></aside>
      <main id="main">
        <div id="group-header"></div>
        <div id="file-header"></div>
        <div id="notice" hidden></div>
        <div id="diff-viewport"><div id="diff-content"></div></div>
      </main>
    </div>
    <footer id="approval-footer"></footer>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
