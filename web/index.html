<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kemi</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="modulepreload" href="assets/app.js" />
    <link rel="modulepreload" href="assets/actions.js" />
    <link rel="modulepreload" href="assets/api.js" />
    <link rel="modulepreload" href="assets/dom.js" />
    <link rel="modulepreload" href="assets/features/comment-list.js" />
    <link rel="modulepreload" href="assets/features/comments.js" />
    <link rel="modulepreload" href="assets/features/display.js" />
    <link rel="modulepreload" href="assets/features/horizontal-scroll.js" />
    <link rel="modulepreload" href="assets/features/files.js" />
    <link rel="modulepreload" href="assets/features/narrow.js" />
    <link rel="modulepreload" href="assets/features/navigation.js" />
    <link rel="modulepreload" href="assets/features/rendered.js" />
    <link rel="modulepreload" href="assets/features/submit.js" />
    <link rel="modulepreload" href="assets/features/theme.js" />
    <link rel="modulepreload" href="assets/features/units.js" />
    <link rel="modulepreload" href="assets/model.js" />
    <link rel="modulepreload" href="assets/state.js" />
    <link rel="modulepreload" href="assets/storage.js" />
    <link rel="modulepreload" href="assets/views/comment-list.js" />
    <link rel="modulepreload" href="assets/views/comment.js" />
    <link rel="modulepreload" href="assets/views/diff-rows.js" />
    <link rel="modulepreload" href="assets/views/file-header.js" />
    <link rel="modulepreload" href="assets/views/header.js" />
    <link rel="modulepreload" href="assets/views/nav.js" />
    <link rel="modulepreload" href="assets/views/overlay.js" />
    <link rel="modulepreload" href="assets/views/rendered.js" />
    <link rel="modulepreload" href="assets/views/tree.js" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">kemi</div>
      <button
        class="iconbtn narrow-only"
        id="btn-tree"
        type="button"
        title="File tree"
        aria-label="Open file tree"
        aria-expanded="false"
      >
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6 2.5v11M8.5 6h3.5M8.5 8.5h3.5"/></svg>
      </button>
      <div class="title-block">
        <div class="title-row">
          <div class="title" id="review-title"></div>
          <button
            class="title-button narrow-only"
            id="btn-title"
            type="button"
            popovertarget="title-sheet"
            aria-label="Open review details"
          ></button>
          <button
            class="notes-button"
            id="btn-notes"
            type="button"
            popovertarget="review-notes"
            aria-label="Open manifest meta"
            title="meta"
            hidden
          >i</button>
        </div>
        <div class="subtitle" id="review-subtitle" hidden></div>
      </div>
      <div class="unit-switch" id="unit-switch" role="group" aria-label="Group unit" hidden></div>
      <div class="meta" id="review-meta"></div>
      <div class="progress" id="progress" title="Seen files / total" hidden>
        <span class="bar"><i id="progress-bar"></i></span>
        <span id="progress-text"></span>
      </div>
      <span class="spacer"></span>
      <div class="tools">
        <div class="seg" role="group" aria-label="Display mode">
          <button
            class="iconbtn"
            id="btn-unified"
            type="button"
            aria-pressed="true"
            title="1 column (unified)"
          >
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
          </button>
          <button
            class="iconbtn"
            id="btn-split"
            type="button"
            aria-pressed="false"
            title="2 columns (split)"
          >
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M8 2.5v11"/></svg>
          </button>
        </div>
        <button
          class="iconbtn"
          id="btn-wrap"
          type="button"
          aria-pressed="false"
          title="Wrap"
        >
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M2 8h8a2 2 0 1 1 0 4H7"/><path d="M9 10.5 7 12l2 1.5"/></svg>
        </button>
        <button
          class="chip"
          id="chip-focus"
          type="button"
          aria-pressed="false"
          title="Show only focused files"
        >
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8 9.9 5.7l4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
        </button>
        <button
          class="chip"
          id="chip-sort"
          type="button"
          aria-pressed="false"
          title="Sort by change size"
        >
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 3v10M4 13l-2-2M4 13l2-2M9 4h5M9 8h4M9 12h3"/></svg>
        </button>
        <button class="iconbtn" id="btn-theme" type="button" title="Switch theme">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7z"/></svg>
        </button>
        <button class="iconbtn" id="btn-comments" type="button" title="Comment list" aria-label="Comment list" aria-expanded="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 3.5h11v7h-6l-3 3v-3h-2z"/></svg>
          <span id="comment-count">0</span>
        </button>
        <button id="update-badge" type="button" class="update-badge" hidden>
          Update available
        </button>
        <button class="btn primary" id="btn-approve" type="button">Approve</button>
        <button class="btn secondary" id="btn-changes" type="button">Request changes</button>
        <button
          class="iconbtn narrow-only"
          id="btn-more"
          type="button"
          popovertarget="view-menu"
          title="View options"
          aria-label="View options"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" stroke="none"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
        </button>
      </div>
      <dl class="review-notes" id="review-notes" popover aria-label="Manifest meta"></dl>
      <div class="view-menu narrow-only" id="view-menu" popover aria-label="View options">
        <button class="menu-item" id="menu-wrap" type="button" aria-pressed="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M2 8h8a2 2 0 1 1 0 4H7"/><path d="M9 10.5 7 12l2 1.5"/></svg>
          Wrap
        </button>
        <button class="menu-item" id="menu-focus" type="button" aria-pressed="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8 9.9 5.7l4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
          Important only
        </button>
        <button class="menu-item" id="menu-sort" type="button" aria-pressed="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 3v10M4 13l-2-2M4 13l2-2M9 4h5M9 8h4M9 12h3"/></svg>
          Sort by change size
        </button>
        <button class="menu-item" id="menu-theme" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7z"/></svg>
          <span id="menu-theme-label">Theme</span>
        </button>
        <button class="menu-item" id="menu-comments" type="button" aria-pressed="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>
          Comments
        </button>
      </div>
      <div class="sheet narrow-only" id="title-sheet" popover aria-label="Review details">
        <div class="sheet-head">
          <b>Review</b>
          <button class="sheet-close" id="sheet-close" type="button" popovertarget="title-sheet" popovertargetaction="hide">Close</button>
        </div>
        <div class="sheet-body">
          <div class="sheet-title" id="sheet-title"></div>
          <div class="sheet-subtitle" id="sheet-subtitle" hidden></div>
          <div class="sheet-meta" id="sheet-meta"></div>
          <dl class="sheet-notes" id="sheet-notes"></dl>
        </div>
      </div>
    </header>

    <div class="comment-list" id="comment-list" role="dialog" aria-label="Comment list" hidden></div>

    <div class="layout">
      <aside class="tree" id="tree" aria-label="File tree"></aside>
      <div class="narrow-only" id="drawer-scrim"></div>
      <main id="main">
        <div class="group-header" id="group-header"></div>
        <div class="file-header" id="file-header"></div>
        <div id="floating-threads" hidden></div>
        <div id="notice" hidden></div>
        <div id="diff-area">
          <div id="diff-viewport"><div id="diff-content"></div><div id="rendered-doc" hidden></div></div>
          <div id="ruler" title="Changes and comments">
            <canvas id="ruler-canvas"></canvas>
            <div id="ruler-view"></div>
          </div>
          <div class="navpill" id="nav" role="group" aria-label="Move between changes" hidden>
            <button type="button" id="nav-prev" title="Previous change (p)"><kbd>p</kbd>Previous change</button>
            <span class="pos" id="nav-pos"></span>
            <button type="button" id="nav-next" title="Next change (n)">Next change<kbd>n</kbd></button>
          </div>
          <div id="toast" role="status" hidden></div>
        </div>
        <div id="horizontal-scroll" tabindex="0" role="region" aria-label="Scroll both code panes horizontally" hidden><div id="horizontal-scroll-width"></div></div>
      </main>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <div class="row">
          <button class="btn" id="modal-cancel" type="button">Back</button>
          <button class="btn" id="modal-ok" type="button"></button>
        </div>
      </div>
    </div>

    <div id="overlay" hidden><div id="overlay-card"></div></div>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
