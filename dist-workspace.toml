[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
# Build and upload artifacts on PRs too, so cross-compilation is verified before a release
pr-run-mode = "upload"
# Where to host releases
hosting = "github"
# 配布の job でビルドのキャッシュを復元しない（pr-run-mode = "upload" だと既定で有効になる）
cache-builds = false

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# 生成する release.yml の actions をコミットで固定する。版はコメントに残す
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"  # v6.1.0
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"  # v8.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
