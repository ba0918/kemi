[package]
name = "kemi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A local review tool that shows changes in a browser and returns comments as JSON"
repository = "https://github.com/ba0918/kemi"

[workspace]
members = ["crates/kemi-core", "crates/kemi-server", "crates/kemi-webview"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
wildcard_enum_match_arm = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[lints]
workspace = true

[dependencies]
kemi-core = { path = "crates/kemi-core" }
kemi-server = { path = "crates/kemi-server" }
kemi-webview = { path = "crates/kemi-webview" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
getrandom = "0.3"
inquire = "0.9.4"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
